defaultBaseImage: mcr.microsoft.com/azurelinux/distroless/base:3.0.20261022@sha256:6b85a86416a29cdcfd404e9fbd9c5ef49cc0612882cecc702535dcac39c9446c
defaultPlatforms:
  - linux/arm64
  - linux/amd64
defaultEnv:
  - CGO_ENABLED=1
builds:
  # Unlike the controller, the pod network agent builds without cgo, so that any host builds its image for
  # both architectures and its binary runs in any image.
  - id: pod-network-agent
    main: ./cmd/pod-network-agent
    env:
      - CGO_ENABLED=0
